<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcelona Enterprises</title>
    <meta name="description" content="AI-accelerated SystemVerilog & Verilog IP cores for FPGA and ASIC.">
    <style>
        :root {
            --primary: #0a192f;
            --accent: #64ffda;
            --text: #8892b0;
            --heading: #ccd6f6;
            --bg-card: #112240;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary);
            color: var(--text);
            margin: 0;
            line-height: 1.6;
        }
        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 20px;
        }
        h1 {
            color: var(--heading);
            font-size: 2.25rem;
            margin-bottom: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 25px;
            border: 1px solid #233554;
        }
        .card h2 {
            color: var(--heading);
            margin-top: 0;
            font-size: 1.25rem;
        }
        .card a {
            display: inline-block;
            color: var(--accent);
            text-decoration: none;
            border: 1px solid var(--accent);
            padding: 10px 20px;
            border-radius: 4px;
            margin-top: 12px;
            font-weight: 600;
        }
        .card a:hover {
            background: rgba(100, 255, 218, 0.1);
        }
    </style>
</head>
<body>
    <main>
        <h1>Barcelona Enterprises</h1>
        <p>AI-accelerated SystemVerilog &amp; Verilog IP cores for FPGA and ASIC.</p>
        <div class="grid">
            <article class="card">
                <h2>Barcelona Enterprises</h2>
                <p>Portfolio site, demos, and documentation.</p>
                <a href="barcelona-enterprizes/index.html">Visit site</a>
            </article>
            <article class="card">
                <h2>Digital IP Catalog</h2>
                <p>Browse the digital IP core catalog.</p>
                <a href="digital_ip/docs/index.html">Browse catalog</a>
            </article>
        </div>
    </main>
</body>
</html>

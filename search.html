<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a192f">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Search | FPGA Cores 4U</title>
    <meta name="description" content="Search FPGA Cores 4U SystemVerilog IP cores, specifications and design notes.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://pbarcelona-ai.github.io/search.html">
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="/pagefind/pagefind-ui.css">
    <style>
        main { max-width: 820px; margin: 0 auto; padding: 60px 20px 100px; }
        h1 { font-size: 2.1rem; margin-bottom: 8px; }
        .eyebrow { color: var(--accent); font-family: monospace; font-size: 0.85rem; text-transform: uppercase; }
        #search {
            --pagefind-ui-scale: 0.95;
            --pagefind-ui-primary: #64ffda;
            --pagefind-ui-text: #ccd6f6;
            --pagefind-ui-background: #112240;
            --pagefind-ui-border: #233554;
            --pagefind-ui-tag: #1d2d50;
            --pagefind-ui-border-width: 1px;
            --pagefind-ui-border-radius: 6px;
            --pagefind-ui-font: inherit;
            margin-top: 28px;
        }
        #search .pagefind-ui__result-excerpt, #search .pagefind-ui__message { color: #8892b0; }
        #search mark { background: rgba(100, 255, 218, 0.18); color: #ccd6f6; }
        .fallback { margin-top: 24px; }
        .back { display: inline-block; margin-top: 40px; }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Search</p>
        <h1>Search IP cores and design notes</h1>
        <p>Search every core's specifications, parameters and documentation, plus the design notes. Try <a href="?q=async+fifo">async FIFO</a>, <a href="?q=crc">CRC</a>, <a href="?q=axi4-lite">AXI4-Lite</a> or <a href="?q=scaler">scaler</a>.</p>
        <div id="search"></div>
        <noscript><p class="fallback">Search needs JavaScript. Browse the <a href="ip/">full IP catalog</a> instead.</p></noscript>
        <a class="back" href="./">&larr; Back to homepage</a>
    </main>
    <script src="/pagefind/pagefind-ui.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", function () {
            if (typeof PagefindUI === "undefined") {
                document.getElementById("search").innerHTML =
                    '<p class="fallback">Search is unavailable right now. Browse the <a href="ip/">full IP catalog</a> instead.</p>';
                return;
            }
            var ui = new PagefindUI({ element: "#search", showSubResults: true, showImages: false, resetStyles: false });
            var q = new URLSearchParams(window.location.search).get("q");
            if (q) ui.triggerSearch(q);
        });
    </script>
</body>
</html>

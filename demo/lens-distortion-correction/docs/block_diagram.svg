<text x="297.0" y="158" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">K1-K3, P1-P2 (radial+tangential)</text>
<text x="297.0" y="172" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">FX FY CX CY, CALIB_MODE</text>
<rect x="438" y="106" width="264" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="570.0" y="126" font-size="11" font-weight="bold" text-anchor="middle" fill="#111827">Derived config</text>
<text x="570.0" y="144" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">cx,cy,fx,fy from centre/scale/size</text>
<text x="570.0" y="158" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">(mulq_s pipelines, settle FSM)</text>
<text x="570.0" y="172" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">2x fixed_recip -&gt; 1/fx, 1/fy</text>
<rect x="738" y="80" width="400" height="46" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="938.0" y="100" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111827">Shared: barrel_pkg (Q16.16, qmul/qsat/qsat48, MAX_W/H=128),</text>
<text x="938.0" y="118" font-size="10" font-weight="normal" text-anchor="middle" fill="#374151">distortion_model_pkg (calib_params_t)</text>
<rect x="738" y="132" width="400" height="46" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="938.0" y="152" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111827">mulq_s IP: (a*b)&gt;&gt;&gt;16 in 2 cycles, four 16x16 DSP</text>
<text x="938.0" y="170" font-size="10" font-weight="normal" text-anchor="middle" fill="#374151">partial products. Used by coord_gen and axi_lite_regs.</text>
<rect x="158" y="262" width="145" height="96" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="230.5" y="282" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111827">axis_in_ctrl</text>
<text x="230.5" y="300" font-size="10" font-weight="normal" text-anchor="middle" fill="#374151">AXI-S slave</text>
<text x="230.5" y="314" font-size="10" font-weight="normal" text-anchor="middle" fill="#374151">raster write addr</text>
<text x="230.5" y="328" font-size="10" font-weight="normal" text-anchor="middle" fill="#374151">tuser -&gt; addr 0</text>
<rect x="158" y="388" width="145" height="76" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="230.5" y="408" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111827">Top FSM</text>
<text x="230.5" y="426" font-size="10" font-weight="normal" text-anchor="middle" fill="#374151">T_LOAD -&gt; T_OUTPUT</text>
<text x="230.5" y="440" font-size="10" font-weight="normal" text-anchor="middle" fill="#374151">capture_en / busy</text>
<rect x="340" y="250" width="165" height="260" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="422.5" y="270" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111827">frame_buffer</text>
<text x="422.5" y="288" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">4x replicated RAMB36</text>
<text x="422.5" y="302" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">banks, internal memory</text>
<text x="422.5" y="316" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">only (no external DDR)</text>
<text x="422.5" y="330" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">128 x 128 x 24 bit each</text>
<text x="422.5" y="344" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151"></text>
<text x="422.5" y="358" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">1 write port</text>
<text x="422.5" y="372" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">4 read ports</text>
<text x="422.5" y="386" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">(2x2 bilinear corners)</text>
<text x="422.5" y="400" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">1-cycle sync read</text>
<rect x="538" y="200" width="560" height="380" rx="8" fill="none" stroke="#16a34a" stroke-width="2"/>
<text x="548" y="218" font-size="12" font-weight="bold" text-anchor="start" fill="#16a34a">axis_out_ctrl</text>
<rect x="552" y="226" width="155" height="96" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="629.5" y="246" font-size="11" font-weight="bold" text-anchor="middle" fill="#111827">Raster generator</text>
<text x="629.5" y="264" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">x, y counters</text>
<text x="629.5" y="278" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">line gap</text>
<text x="629.5" y="292" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">1 pixel/clock,</text>
<text x="629.5" y="306" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">never stalls</text>
<rect x="552" y="336" width="155" height="130" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="629.5" y="356" font-size="11" font-weight="bold" text-anchor="middle" fill="#111827">coord_gen  (23 cycles)</text>
<text x="629.5" y="374" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">radial + tangential</text>
<text x="629.5" y="388" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">normalize (x-cx)/fx</text>
<text x="629.5" y="402" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">r2,r4,r6 -&gt; factor</text>
<text x="629.5" y="416" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">sx = cx + n*factor*fx</text>
<text x="629.5" y="430" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">every mult = mulq_s</text>
<text x="629.5" y="444" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">+ qsat48</text>
<rect x="730" y="226" width="175" height="96" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="817.5" y="246" font-size="11" font-weight="bold" text-anchor="middle" fill="#111827">Address expand  (4 stages)</text>
<text x="817.5" y="264" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">clamp-to-edge, int/frac split</text>
<text x="817.5" y="278" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">row base = y0*width</text>
<text x="817.5" y="292" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">(registered)</text>
<text x="817.5" y="306" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">4 corner addresses</text>
<rect x="730" y="336" width="175" height="96" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="817.5" y="356" font-size="11" font-weight="bold" text-anchor="middle" fill="#111827">bilinear  (3 stages)</text>
<text x="817.5" y="374" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">2x2 taps, 8-bit weights</text>
<text x="817.5" y="388" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">12 pixel*weight products</text>
<text x="817.5" y="402" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">then sum + round</text>
<rect x="930" y="226" width="148" height="206" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="1004.0" y="246" font-size="11" font-weight="bold" text-anchor="middle" fill="#111827">Output stage</text>
<text x="1004.0" y="264" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">pixel select</text>
<text x="1004.0" y="278" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151"></text>
<text x="1004.0" y="292" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">tlast/tuser tag</text>
<text x="1004.0" y="306" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">delay line</text>
<text x="1004.0" y="320" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">31-deep shift reg</text>
<text x="1004.0" y="334" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">(coord_gen 23 +</text>
<text x="1004.0" y="348" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">addr-expand 4 +</text>
<text x="1004.0" y="362" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">fb read 1 +</text>
<text x="1004.0" y="376" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#374151">bilinear 3)</text>

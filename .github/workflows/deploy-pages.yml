# ***************
# Filename: deploy-pages.yml
# Description: Builds and publishes this repository to GitHub Pages
# on every push to main, and on manual dispatch. Regenerates the IP pages
# from the digital_ip submodule (scripts/build_digital_ip_docs.py), adds
# sitemap/cards/analytics (scripts/finalize_site.py), builds the Pagefind
# search index, deploys, then pings IndexNow (scripts/indexnow.py).
# ***************
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0          # full history for sitemap lastmod dates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build tools
        run: python3 -m pip install pillow "pagefind[extended]==1.5.2"
      - name: Regenerate IP pages from the submodule
        run: python3 scripts/build_digital_ip_docs.py
      - name: Sitemap, social cards and analytics
        run: python3 scripts/finalize_site.py
      - name: Build the search index
        run: python3 -m pagefind --site .
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    name: Notify search engines (IndexNow)
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Submit URLs from the live sitemap
        run: python3 scripts/indexnow.py
